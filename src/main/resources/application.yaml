spring:
  application:
    name: GestionFacturas

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestionfacturas}
    username: ${DB_USERNAME:gestion}
    password: ${DB_PASSWORD:gestion-facturas}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  storage:
    local:
      base-path: ${STORAGE_BASE_PATH:./storage}
  ocr:
    tesseract:
      datapath: ${TESSERACT_DATAPATH:}
      language: ${TESSERACT_LANGUAGE:spa}