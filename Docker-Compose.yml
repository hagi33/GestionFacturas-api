services:
  postgres:
    image: postgres:17
    container_name: gastos-postgres
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
    ports:
      - "5432:5432"
    volumes:
      - gastos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d gastos"]
      interval: 5s
      timeout: 5s
      retries: 5

